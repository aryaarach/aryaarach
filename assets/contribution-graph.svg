    <text x="311.7" y="196" text-anchor="middle" fill="var(--dim)">02</text>
    <rect class="bar" x="366.3" y="129" width="41.4" height="51" fill="var(--ink)" style="transform-origin:366.3px 180px"/>
    <text x="387.0" y="196" text-anchor="middle" fill="var(--dim)">03</text>
    <rect class="bar" x="441.6" y="137" width="41.4" height="43" fill="var(--ink)" style="transform-origin:441.6px 180px"/>
    <text x="462.3" y="196" text-anchor="middle" fill="var(--dim)">04</text>
    <rect class="bar" x="517.0" y="108" width="41.4" height="72" fill="var(--ink)" style="transform-origin:517.0px 180px"/>
