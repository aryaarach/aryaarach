<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contribution activity by month">
  <style>
    :root { --ink:#000000; --dim:#555555; }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .bar { transform: scaleY(0); animation: grow .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleY(1); } }
    @media (prefers-reduced-motion:reduce) { .bar { animation:none; transform:scaleY(1); } }
  </style>

  <text class="mono" x="48" y="28" font-size="11" letter-spacing="2.5" fill="var(--dim)">CONTRIBUTION TELEMETRY · LAST 12 MONTHS</text>
  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--ink)" opacity=".3"/>

  <g class="mono" font-size="9" fill="var(--ink)">
    <rect class="bar" x="64.9" y="166" width="41.4" height="14" fill="var(--ink)" style="transform-origin:64.9px 180px"/>
    <text x="85.7" y="196" text-anchor="middle" fill="var(--dim)">11</text>
    <rect class="bar" x="140.3" y="156" width="41.4" height="24" fill="var(--ink)" style="transform-origin:140.3px 180px"/>
