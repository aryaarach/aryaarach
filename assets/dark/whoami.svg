<svg viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — Arya Rachman Indrawan bio, focus, status">
  <style>
    :root { --bone: #F0F6FC; --rule: #30363D; --muted: #8B949E; --accent: #C9D1D9; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <text class="mono rise a1" x="48" y="34" font-size="16" fill="var(--bone)">Undergraduate Student in Informatics Engineering (Semester 5) — Pamulang University.</text>
  <text class="mono rise a2" x="48" y="62" font-size="16" fill="var(--bone)">Self-taught programmer building across Mobile, Backend, Web, and Machine Learning.</text>
  <text class="mono rise a3" x="48" y="90" font-size="15" fill="var(--muted)">Passionate about clean architecture, solving complex challenges, and exploring modern tools.</text>

  <line class="rise a4" x1="48" y1="118" x2="952" y2="118" stroke="var(--rule)" stroke-width="1" opacity=".7"/>

  <text class="mono rise a4" x="48"  y="150" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS  ▸ </text>
  <text class="mono rise a4" x="154" y="150" font-size="15" fill="var(--bone)">Mobile Apps (Flutter) · Backend Architecture (Go, Laravel) · Machine Learning · APIs</text>

  <text class="mono rise a5" x="48"  y="184" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS  ▸ </text>
  <text class="mono rise a5" x="154" y="184" font-size="15" fill="var(--accent)">Open to Internships · Freelance · Open Source · Collaborative Projects</text>

  <text class="mono rise a6" x="48"  y="218" font-size="11" fill="var(--muted)" letter-spacing="2.5">TRACK   ▸ </text>
  <text class="mono rise a6" x="154" y="218" font-size="15" fill="var(--bone)">Self-Taught Developer → Informatics Degree | 
    <tspan font-size="11" fill="var(--muted)" letter-spacing="2.5">INTEREST ▸ </tspan>
    <tspan font-size="15" fill="var(--bone)">UI/UX (Figma) · 3D (Blender) · Software Craft</tspan>
  </text>
</svg>
