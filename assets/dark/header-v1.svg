<svg viewBox="0 0 1000 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arya Rachman Indrawan — Self-Taught Programmer &amp; Informatics Student">
  <style>
    :root { --bone: #F0F6FC; --rule: #30363D; --muted: #8B949E; --dim: #6E7681; --accent: #C9D1D9; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.6s} .a4{animation-delay:.85s} .a5{animation-delay:1.1s} .a6{animation-delay:1.35s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade { animation: none; }
      .draw{stroke-dashoffset:0} .rise,.fade{opacity:1}
    }
  </style>

  <line class="draw a1" x1="48" y1="52" x2="952" y2="52" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="38" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="38" font-size="11" letter-spacing="3.5" text-anchor="end">INDONESIA — 6.20° S &amp; 106.81° E</text>
  </g>

  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="152" font-size="64" font-weight="700" letter-spacing="-1.5">Arya Rachman I</text>
  </g>
  <g class="fade a3">
    <text fill="var(--muted)" class="mono" x="48" y="190" font-size="18">Self-Taught Programmer &amp; Informatics Student — Indonesia</text>
  </g>

  <g class="fade a4">
    <text fill="var(--dim)" class="mono" x="48" y="244" font-size="12.5" letter-spacing="1">Focus  ▸</text>
    <text fill="var(--accent)" class="mono" x="128" y="244" font-size="12.5" letter-spacing="1">Mobile Apps (Flutter) · Backend (Go, Laravel) · Machine Learning · Web Systems</text>
  </g>
  <g class="fade a5">
    <text fill="var(--dim)" class="mono" x="48" y="270" font-size="12.5" letter-spacing="1">Status ▸</text>
    <text fill="var(--accent)" class="mono" x="128" y="270" font-size="12.5" letter-spacing="1">Undergraduate Semester 5 · Open to Internships · Collaboration · Projects</text>
  </g>

  <line class="draw a5" x1="48" y1="312" x2="952" y2="312" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a6">
    <text fill="var(--muted)" class="mono" x="48" y="342" font-size="11.5" letter-spacing="3">MOBILE APPS</text>
    <text fill="var(--accent)" class="mono" x="180" y="342" font-size="11.5">·</text>
    <text fill="var(--muted)" class="mono" x="205" y="342" font-size="11.5" letter-spacing="3">BACKEND SYSTEMS</text>
    <text fill="var(--accent)" class="mono" x="385" y="342" font-size="11.5">·</text>
    <text fill="var(--muted)" class="mono" x="410" y="342" font-size="11.5" letter-spacing="3">MACHINE LEARNING</text>
    <text fill="var(--muted)" class="mono" x="952" y="342" font-size="11.5" letter-spacing="3" text-anchor="end">YEAR 2026</text>
  </g>
</svg>
