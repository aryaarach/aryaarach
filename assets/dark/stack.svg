<svg viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arya Technical Stack — languages, mobile, backend, web, databases, ml, tools, creative">
  <style>
    :root { --bone: #F0F6FC; --rule: #30363D; --muted: #8B949E; --accent: #C9D1D9; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s} .a7{animation-delay:.7s} .a8{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="158" y1="12" x2="158" y2="308" stroke="var(--rule)" stroke-width="1" opacity=".6"/>

  <text class="mono rise a1" x="48" y="34"  font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="178" y="34"  font-size="15" fill="var(--bone)">Go · Dart · PHP · Python</text>

  <text class="mono rise a2" x="48" y="72"  font-size="12" fill="var(--muted)" letter-spacing="2">MOBILE</text>
  <text class="mono rise a2" x="178" y="72"  font-size="15" fill="var(--bone)">Flutter · Dart Framework · Cross-Platform Apps</text>

  <text class="mono rise a3" x="48" y="110" font-size="12" fill="var(--muted)" letter-spacing="2">BACKEND</text>
  <text class="mono rise a3" x="178" y="110" font-size="15" fill="var(--bone)">Go · Laravel · RESTful APIs · Architecture Patterns</text>

  <text class="mono rise a4" x="48" y="148" font-size="12" fill="var(--muted)" letter-spacing="2">WEB</text>
  <text class="mono rise a4" x="178" y="148" font-size="15" fill="var(--bone)">Tailwind CSS · Blade · Responsive Web Design</text>

  <text class="mono rise a5" x="48" y="186" font-size="12" fill="var(--muted)" letter-spacing="2">DATABASES</text>
  <text class="mono rise a5" x="178" y="186" font-size="15" fill="var(--bone)">MySQL · Firebase · Database Modeling &amp; Schema Design</text>

  <text class="mono rise a6" x="48" y="224" font-size="12" fill="var(--muted)" letter-spacing="2">ML &amp; DATA</text>
  <text class="mono rise a6" x="178" y="224" font-size="15" fill="var(--bone)">NumPy · Pandas · Scikit-Learn · Linear &amp; Logistic Regression</text>

  <text class="mono rise a7" x="48" y="262" font-size="12" fill="var(--muted)" letter-spacing="2">TOOLING</text>
  <text class="mono rise a7" x="178" y="262" font-size="15" fill="var(--bone)">Visual Studio Code · Git · GitHub · Postman · Terminal</text>

  <text class="mono rise a8" x="48" y="300" font-size="12" fill="var(--muted)" letter-spacing="2">CREATIVE</text>
  <text class="mono rise a8" x="178" y="300" font-size="15" fill="var(--bone)">Figma (UI/UX Design) · Blender (3D Modeling &amp; Rendering)</text>
</svg>
